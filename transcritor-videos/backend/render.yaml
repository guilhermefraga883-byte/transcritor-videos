services:
  - type: web
    name: transcritor-backend
    env: python
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg
      pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 600 --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      - key: WHISPER_MODEL
        value: small
    disk:
      name: whisper-models
      mountPath: /root/.cache/whisper
      sizeGB: 5
